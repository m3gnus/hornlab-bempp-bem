[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-bempp-bem"
version = "0.1.1"
description = "Cross-platform bempp-cl acoustic BEM solver for HornLab"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "numpy>=1.21",
    # Floor is the version this package is actually exercised against. Upstream
    # bempp-cl runs no Windows or macOS CI, so "it installed" is not evidence it
    # solves -- scripts/windows_smoke.py is what establishes that, and 0.4.2 is
    # what it has been run against. Note 0.4.2 imports as `bempp_cl`, not
    # `bempp`. Keep the <0.5 cap: this package reaches into bempp-cl internals
    # (see _opencl_program_cache and _opencl_singular_workgroup), so a minor
    # bump needs the smoke test re-run rather than assumed.
    "bempp-cl>=0.4.2,<0.5",
    "meshio>=5.0",
    # bie.py calls scipy.linalg directly; until now scipy only arrived
    # transitively via bempp-cl.
    "scipy>=1.7",
]

[project.optional-dependencies]
opencl = ["pyopencl"]
dev = ["pytest", "pyopencl"]

# State the package explicitly rather than letting setuptools guess. Flat-layout
# auto-discovery fails the moment a second top-level directory appears that is
# not on setuptools' conventional exclude list: adding runs/ for benchmark
# artefacts broke `pip install -e .` on every platform with "Multiple top-level
# packages discovered in a flat-layout: ['runs', 'hornlab_bempp_bem']", while
# scripts/ had been harmless because setuptools excludes that name by default.
# Naming the package makes any future top-level directory a non-event.
[tool.setuptools]
packages = ["hornlab_bempp_bem"]

[tool.pytest.ini_options]
markers = [
    "slow: validation tests that run a real BEM solve",
]
